name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene-and-validation:
    name: Repo Hygiene & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for forbidden runtime/secret files
        run: |
          set -e
          FORBIDDEN_FOUND=0
          for pattern in "server.properties" ".env" "ops.json" "usercache.json" "eula.txt"; do
            if [ -f "$pattern" ]; then
              echo "::error::Forbidden runtime/secret file committed: $pattern"
              FORBIDDEN_FOUND=1
            fi
          done
          if find . -maxdepth 3 -name "*.jar" | grep -q .; then
            echo "::error::Binary JAR file found in repository. Use releases or artifact storage instead."
            FORBIDDEN_FOUND=1
          fi
          if [ -d "world" ]; then
            echo "::error::Minecraft world/ directory must not be committed to Git."
            FORBIDDEN_FOUND=1
          fi
          exit $FORBIDDEN_FOUND

      - name: Set up Python for config & script validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON and YAML syntax
        run: |
          python -m pip install --no-cache-dir pyyaml
          python -c "
          import json, pathlib, sys, yaml
          errors = 0
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f'::error file={p}::Invalid JSON: {e}')
                  errors += 1
          for ext in ('*.yml', '*.yaml'):
              for p in pathlib.Path('.').rglob(ext):
                  if '.git' in p.parts or 'node_modules' in p.parts:
                      continue
                  try:
                      yaml.safe_load(p.read_text(encoding='utf-8'))
                  except Exception as e:
                      print(f'::error file={p}::Invalid YAML: {e}')
                      errors += 1
          sys.exit(1 if errors else 0)
          "

      - name: Run Python lint & tests (when Python modules exist)
        run: |
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -d "tests" ]; then
            pip install --no-cache-dir ruff mypy pytest
            ruff format --check .
            ruff check .
            if [ -d "tests" ]; then
              pytest tests/
            fi
          else
            echo "No Python modules/tests yet — skipping Python lint/test stage."
          fi
