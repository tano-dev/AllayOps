name: Enforce Conventional Commits

on:
  pull_request:
    types: ["opened", "edited", "reopened", "synchronize"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional Commit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install commitlint
        run: |
          npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
          cat << 'EOF' > commitlint.config.cjs
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'header-max-length': [0],
              'body-max-line-length': [0],
              'footer-max-line-length': [0],
              'subject-case': [0]
            }
          };
          EOF

      - name: Validate PR Commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --config commitlint.config.cjs --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate Push Commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --config commitlint.config.cjs --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
