name: "🐛 Bug Report"
description: Report a bug in the Minecraft Server, Mods, Agentic layer, or CI/CD
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Minecraft Server (Fabric)
        - Mods / Plugins
        - Agentic / Research Layer
        - CI/CD & GitHub Automation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start server with `start.bat`
        2. Run experiment / command ...
        3. Observe crash or error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash Report Snippet (Redact Secrets!)
      render: text

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS: Windows 11 | Java: JDK 25 | Fabric MC: 26.3 (Loader 0.20.1)"
    validations:
      required: true
