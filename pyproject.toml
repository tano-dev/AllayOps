[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allayops"
version = "0.1.0"
description = "Enterprise-grade Minecraft Fabric Server & Safe Agentic Self-Healing Research Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".fabric",
  "world",
  "logs",
  "crash-reports",
  "libraries",
  "versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
