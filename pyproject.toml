[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allayops"
version = "0.1.0"
description = "AllayOps: Autonomous Low-Latency Agentic Ops for Self-Healing Minecraft Servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/tano-dev/AllayOps"
Repository = "https://github.com/tano-dev/AllayOps"
Research-Foundation = "https://github.com/tano-dev/Safe-Agentic-DataOps-for-Self-Healing-Real-Time-E-Commerce-Data-Pipelines"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".fabric",
  "world",
  "logs",
  "crash-reports",
  "libraries",
  "versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
